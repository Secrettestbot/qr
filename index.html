<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR report viewer</title></head>
<body style="font:16px/1.5 system-ui,sans-serif;max-width:36em;margin:2em auto;padding:0 1em">
<h1>QR report viewer</h1>
<p>Scan a printed report code with your phone's camera. The link opens <a href="r/">the viewer</a>, which unpacks the report on your phone. The report travels inside the code: the part of the link after <code>#</code> is never sent to this site.</p>
<p>After the first visit the viewer also works offline.</p>
</body></html>
